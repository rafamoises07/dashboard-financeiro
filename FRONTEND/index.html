<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas Finanças</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <h1 class="brand">Minhas Finanças</h1>
    <nav id="nav">
      <button class="nav-btn active" data-view="visao"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span>Visão geral</span></button>
      <button class="nav-btn" data-view="movs"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Movimentações</span></button>
      <button class="nav-btn" data-view="cats"><svg viewBox="0 0 24 24"><path d="M3 12V3h9l9 9-9 9-9-9zM7.5 7.5h.01"/></svg><span>Categorias</span></button>
    </nav>
  </aside>
  <main>
    <header class="top">
      <div>
        <h2 id="titulo">Visão geral</h2>
        <p id="subtitulo">Seu mês em números</p>
      </div>
      <div class="acoes-topo">
        <div id="periodo" class="periodo">
          <select id="mes" aria-label="Mês"></select>
          <select id="ano" aria-label="Ano"></select>
        </div>
        <button class="primary" id="novo">+ <span>Nova movimentação</span></button>
      </div>
    </header>
    <section id="visao" class="view"></section>
    <section id="movs" class="view" hidden></section>
    <section id="cats" class="view" hidden></section>
    <p class="rodape">Prévia visual. Dados fictícios.</p>
  </main>
</div>

<dialog id="modal">
  <form id="form" class="form" autocomplete="off">
    <h3 id="modal-titulo">Nova movimentação</h3>
    <input type="hidden" name="movId">
    <div class="seg">
      <label><input type="radio" name="tipo" value="despesa" checked><span>Despesa</span></label>
      <label><input type="radio" name="tipo" value="receita"><span>Receita</span></label>
    </div>
    <label>Descrição<input name="descricao" required maxlength="60"></label>
    <div class="linha">
      <label>Valor (R$)<input name="valor" type="number" step="0.01" min="0.01" required></label>
      <label>Data<input name="data" type="date" required></label>
    </div>
    <label>Categoria<select name="categoriaId" required></select></label>
    <div id="campos-despesa" class="linha">
      <label>Classificação<select name="natureza"><option value="fixo">Fixo</option><option value="variavel">Variável</option></select></label>
      <label>Forma de pagamento<select name="forma"></select></label>
    </div>
    <label class="check"><input type="checkbox" name="recorrente"> Repetir todo mês</label>
    <div class="botoes">
      <button type="button" id="cancelar" class="ghost">Cancelar</button>
      <button class="primary">Salvar movimentação</button>
    </div>
  </form>
</dialog>
<script src="js/app.js"></script>
</body>
</html>
